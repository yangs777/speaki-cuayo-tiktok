<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Desktop Authorization Callback</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: #202124;
      background: #f7f3ee;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    code {
      display: block;
      overflow-wrap: anywhere;
      padding: 14px;
      border: 1px solid #ded7ce;
      border-radius: 8px;
      background: #fffaf3;
    }
  </style>
</head>
<body>
  <main>
    <h1>TikTok Desktop Authorization Callback</h1>
    <p>If TikTok returned an authorization code, it appears below.</p>
    <code id="code">No authorization code found in the URL.</code>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");
    const output = code
      ? `code=${code}${state ? `\nstate=${state}` : ""}`
      : "No authorization code found in the URL.";
    document.getElementById("code").textContent = output;
  </script>
</body>
</html>
